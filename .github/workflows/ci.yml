name: CI

# Build the app and run the unit tests on every push and pull request.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test
